name: "AWS Hosted Deployment via Ansible"
on:
  workflow_call:
    inputs:
      aws_asg:
        required: false
        type: string
      aws_runner:
        required: false
        type: string
      aws_region:
        required: false
        type: string
        default: "eu-west-1"
      ansible_playbook:
        required: false
        type: string
        default: "apps.yml"
      ansible_repo:
        required: true
        type: string
      ansible_repo_ref:
        required: false
        type: string
        default: "main"
      deploy: # Output from build stage
        required: true
        type: string
      key: # Output from build stage
        required: true
        type: string
      tag: # Output from build stage
        required: true
        type: string
    secrets:
      ansible_vault_password:
        required: true
      aws_access_key_id:
        required: true
      aws_secret_access_key:
        required: true
      github_pat:
        required: true
      ssh_key:
        required: true

jobs:
  StartHostedRunner:
    name: "Start Hosted Runner"
    runs-on: ubuntu-26.04
    outputs:
      spot-req-id: ${{ steps.StartHostedRunner.outputs.spot-req-id }}
    steps:
      - name: "Starting AWS Hosted Runner"
        shell: bash
        run: |
          echo "Starting ASG: ${{ inputs.aws_asg }}/AWS GitHub Runner ${{ inputs.aws_runner }}..."

      - name: "Start AWS Hosted Runner"
        id: StartHostedRunner
        uses: epimorphics/github-actions/start-hosted-runner@v23
        with:
          aws-access-key-id:     "${{ secrets.aws_access_key_id }}"
          aws-secret-access-key: "${{ secrets.aws_secret_access_key }}"
          aws-region:            "${{ inputs.aws_region }}"
          aws-asg:               "${{ inputs.aws_asg }}"
          aws-runner:            "${{ inputs.aws_runner }}"


  HostedDeploy:
    name: "Hosted Ansible Deployment"
    runs-on: self-hosted
    needs: StartHostedRunner
    steps:
      - name: "Hosted Deploy Action"
        id: HostedDeploy
        shell: bash
        run: |
          echo "This is a self-hosted action running on an AWS EC2 instance started by the StartHostedRunner job."

      - name: "SSH Setup"
        uses: shimataro/ssh-key-action@v2.8.1
        with:
          key: "${{ secrets.ssh_key }}"
          known_hosts: unnesessary

      - name: "AWS Credentials"
        id: AWSCredentials
        uses: epimorphics/github-actions/aws-credentials@v23
        with:
          aws-access-key-id:     "${{ secrets.aws_access_key_id }}"
          aws-secret-access-key: "${{ secrets.aws_secret_access_key }}"

      - name: "Deployment Repository Checkout"
        id: Checkout
        uses: actions/checkout@v6
        with:
          repository: "${{ inputs.ansible_repo }}"
          ref:        "${{ inputs.ansible_repo_ref }}"
          token:      "${{ secrets.github_pat }}"

      - name: "Ansible Deployment"
        if: ( inputs.tag != '' && inputs.deploy != '' && inputs.key != '' )
        uses: epimorphics/github-actions/ansible-deploy-image@v23
        with:
          generate-hosts: "true"
          secret:         "${{ secrets.ansible_vault_password }}"
          stage:          "${{ inputs.deploy }}"
          name:           "${{ inputs.key }}"
          version:        "${{ inputs.tag }}"
          playbook:       "${{ inputs.ansible_playbook }}"

      - name: "Git Commit"
        if: inputs.tag != ''
        shell: bash
        run: |
          if ! git diff --quiet
          then
            git config --global user.name "Github CICD"
            git config --global user.email "noreply@epimorphics.com"
            git commit -am "Github/CICD: ${{ inputs.deploy }}/${{ inputs.key }}:${{ inputs.tag }}"
            git push
          else
            echo "No changes to commit"
            echo "tag: ${{ inputs.tag }}"
          fi


  StopHostedRunner:
    name: "Stop AWS Hosted Runner"
    runs-on: ubuntu-26.04
    needs: [HostedDeploy, StartHostedRunner]
    if: (always())
    steps:
      - name: "Cancel Spot Fleet Request"
        uses: epimorphics/github-actions/stop-hosted-runner@v23
        with:
          aws-access-key-id:     "${{ secrets.aws_access_key_id }}"
          aws-secret-access-key: "${{ secrets.aws_secret_access_key }}"
          aws-asg:               "${{ inputs.aws_asg }}"
